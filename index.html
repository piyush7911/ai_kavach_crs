<script>
var MK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';

/* All figures are taken from reports/benchmark_runs/20260830_094305 :
   benchmark_summary.json, per_target_results.csv, preflight_pov_validation.csv */
var S = [];

S.push(['Title', '\
<div class="slide title-slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach<span class="sep">&middot;</span><span style="font-weight:400;color:var(--text-4)">CRS</span></div>\
  <div class="body rv">\
    <div class="eyebrow">Indian Army &middot; Terrier Cyber Quest 2026</div>\
    <div class="disp">Autonomous<br>remediation for<br>C and C++.</div>\
    <div class="sub">Finds memory-safety defects, patches them with a multi-agent ensemble, and proves each fix by \
      rebuilding the code under sanitizers and replaying the original exploit against the patched binary. \
      It then attempts to falsify its own patches.</div>\
    <div class="strip">\
      <span class="pill g">38 / 38 patched</span>\
      <span class="pill b">24 / 24 PoV-proven</span>\

      <span class="pill n">2 lines median</span>\

      <span>run 20260830_094305</span><span>gpt-4o-mini</span><span>Darwin arm64</span><span>125 unit tests</span>\
    </div>\
  </div>\
</div>']);

S.push(['The problem', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">02</div>\
  <div class="body">\
    <div class="eyebrow rv">Design problem</div>\
    <h2 class="title rv">A model reporting &ldquo;fixed&rdquo;<br><span class="accent">is not evidence.</span></h2>\
    <p class="deck-lede rv" style="margin-bottom:20px;">Three failure modes recur in automated repair. \
      None of them are caught by checking whether the code still compiles.</p>\
    <div class="grid3">\
      <div class="tile crit rv"><div class="num">FAILURE 01</div><div class="th">Context blindness</div>\
        <div class="td">Models patch code whose types they cannot see. Without <b>typedef</b> chains, packed bitfields \
          and cross-header <b>struct</b> layouts, generated C frequently does not compile.</div></div>\
      <div class="tile crit rv"><div class="num">FAILURE 02</div><div class="th">Rubber-stamping</div>\
        <div class="td">A patch is emitted and declared done. Nothing recompiles it under sanitizers, so a fix that \
          <b>changes nothing</b> still reports success.</div></div>\
      <div class="tile crit rv"><div class="num">FAILURE 03</div><div class="th">Gaming the gates</div>\
        <div class="td">A model optimising for a passing check has two cheap moves &mdash; <b>special-case the one test input</b>, \
          or disable the code path. Both clear build, PoV and regression.</div></div>\
    </div>\
    <div class="tile rv" style="margin-top:14px;flex-direction:row;align-items:center;gap:16px;">\
      <div class="td" style="flex:1;"><b>Consequence for evaluation:</b> a pass rate means nothing until you know \
        whether the verification behind it can be gamed. Slide 11 shows what we did about that.</div>\
    </div>\
  </div>\
</div>']);

S.push(['Pipeline', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">03</div>\
  <div class="body">\
    <div class="eyebrow rv">The pipeline</div>\
    <h2 class="title rv">Eight stages.<br><span class="accent">Every one measured, none assumed.</span></h2>\
    <p class="deck-lede rv">A deterministic pipeline, not an agent loop. Each stage produces an artefact the next stage \
      consumes, and each records what it actually executed.</p>\
    <div class="pipe rv" style="margin-top:22px;">\
      <div class="pstep"><div class="n">00</div><div class="t">Pre-flight</div><div class="d">Verify the PoV reproduces before spending anything</div></div>\
      <div class="pstep"><div class="n">01</div><div class="t">Detection</div><div class="d">Semgrep + coverage-guided fuzzing</div></div>\
      <div class="pstep"><div class="n">02</div><div class="t">Triage &amp; context</div><div class="d">Cluster crashes; extract AST context</div></div>\
      <div class="pstep"><div class="n">03</div><div class="t">Ensemble</div><div class="d">Three agents race; critic diagnoses</div></div>\
    </div>\
    <div class="pipe rv" style="margin-top:8px;">\
      <div class="pstep"><div class="n">04</div><div class="t">DRV loop</div><div class="d">Rebuild, replay exploit, re-scan</div></div>\
      <div class="pstep off"><div class="n">05</div><div class="t">Concolic</div><div class="d">Self-gated; disabled on this host</div></div>\
      <div class="pstep hl"><div class="n">06</div><div class="t">Hardening</div><div class="d">Attempt to falsify the patch</div></div>\
      <div class="pstep"><div class="n">07</div><div class="t">Formal</div><div class="d">CBMC bounded proofs</div></div>\
    </div>\
    <div class="grid3 rv" style="margin-top:18px;">\
      <div class="tile"><div class="num">PLUS</div><div class="th">Four-tier memory</div>\
        <div class="td">Working, episodic, semantic, procedural. Only gate-proven fixes are learned.</div></div>\
      <div class="tile ok"><div class="num">RULE</div><div class="th">SKIPPED is not a pass</div>\
        <div class="td">A gate with no command configured reports <span class="pill a">skipped</span>. \
          14 of 44 targets had no reproducible exploit and are reported unproven.</div></div>\
      <div class="tile"><div class="num">COST</div><div class="th">Lightweight by construction</div>\
        <div class="td">All agents on <b>gpt-4o-mini</b>. Expensive work is done by compilers and sanitizers, not tokens.</div></div>\
    </div>\
  </div>\
</div>']);

S.push(['Pre-flight & detection', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">04</div>\
  <div class="body">\
    <div class="eyebrow rv">Stage 00 &middot; Phase 1</div>\
    <h2 class="title rv">Verify the exploit first.<br><span class="accent">Then find the rest.</span></h2>\
    <p class="deck-lede rv">Pre-flight compiles the <b>unpatched</b> target and confirms the proof-of-vulnerability \
      actually reproduces. A target with no reproducible exploit cannot be proven fixed, so it is flagged up front \
      rather than counted later.</p>\
    <div class="grid2 rv" style="margin-top:20px;gap:18px;align-items:start;">\
      <div>\
        <div class="grid2" style="gap:11px;">\
          <div class="metric g"><div class="l">PoV reproduces</div><div class="v">17</div><div class="s">proceed to gating</div></div>\
          <div class="metric a"><div class="l">No reproducible PoV</div><div class="v">14</div><div class="s">reported unproven</div></div>\
        </div>\
        <div class="tile" style="margin-top:11px;"><div class="num">PHASE 1 &middot; PATH A &mdash; STATIC</div>\
          <div class="th">Semgrep &rarr; SARIF 2.1.0</div>\
          <div class="td"><span class="mono">p/security-audit</span> ruleset. Covers the cJSON target set and \
            API-misuse classes across the synthetic suites.</div></div>\
        <div class="tile" style="margin-top:11px;"><div class="num">PHASE 1 &middot; PATH B &mdash; DYNAMIC</div>\
          <div class="th">libFuzzer / AFL++ under ASan + UBSan</div>\
          <div class="td">Built with <span class="mono">-fno-sanitize-recover=all</span> so the first bad access is fatal. \
            The fuzz-discovery suite ran 9 harnesses, produced 8 crash inputs, and triage collapsed them to \
            <b>7 distinct bugs</b>.</div></div>\
      </div>\
      <div>\
        <div class="eyebrow" style="margin-bottom:7px;">What the fuzzer returned</div>\
        <div class="code"><span class="c">==48211==</span><span class="e">ERROR: AddressSanitizer: requested allocation size 0xffffffffffffff43</span>\n\
    (0x748 after adjustments for alignment, red zones, etc.)\n\
    exceeds maximum supported size (thread T0)\n\
<span class="b">    #0 0x102a7c1e0 in wrap_malloc</span>\n\
<span class="b">    #1 0x102a3b044 in build_table 12_integer_underflow.c:6</span>\n\
<span class="b">    #2 0x102a3b1f8 in LLVMFuzzerTestOneInput harness.c:19</span>\n\
<span class="c">SUMMARY: AddressSanitizer: allocation-size-too-big</span>\n\n\
<span class="g">&rarr; crash class mapped to CWE-190</span>\n\
<span class="g">&rarr; location read off the stack trace: file.c:6</span></div>\
        <div class="tile hl" style="margin-top:11px;"><div class="td">\
          <b>The location is discovered, not declared.</b> The file and line come from the crash itself. \
          This is what makes the system a discovery engine rather than a patching tool pointed at a known line.</div></div>\
      </div>\
    </div>\
  </div>\
</div>']);

S.push(['Triage & context', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">05</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 2</div>\
    <h2 class="title rv">Collapse the crashes.<br><span class="accent">Then resolve the types.</span></h2>\
    <p class="deck-lede rv">Patching effort should be spent per bug, not per crashing input. Triage clusters crashes by \
      root cause; the context engine then extracts everything the vulnerable function touches.</p>\
    <div class="grid2 rv" style="margin-top:20px;gap:18px;align-items:start;">\
      <div class="tile"><div class="num">TRIAGE</div><div class="th">Cluster by root cause</div>\
        <div class="td">Each crash input is replayed and its sanitizer report parsed, then clustered by \
          <b>(crash class, normalised top-of-stack frames)</b>. Frames from sanitizer interceptors and libc are stripped, \
          so the same bug reached through different call paths collapses to one report.</div>\
        <div class="code" style="margin-top:10px;font-size:11px;"><span class="c">crash class to CWE mapping, e.g.</span>\n\
heap-buffer-overflow      &rarr; <span class="v">CWE-122</span>\n\
heap-use-after-free       &rarr; <span class="v">CWE-416</span>\n\
requested allocation size &rarr; <span class="v">CWE-190</span>\n\
SEGV                      &rarr; <span class="v">CWE-476</span></div>\
        <div class="td" style="margin-top:9px;"><b>Measured:</b> across 9 fuzz harnesses the suite produced 8 crash \
          inputs, which triage collapsed to <b>7 distinct bugs</b>. Only the fuzz-discovery suite reports clustering \
          figures; the curated suites are patched from a fixed target list.</div></div>\
      <div class="tile"><div class="num">CONTEXT</div><div class="th">Tree-sitter AST extraction</div>\
        <div class="td">Parses the full AST, locates the enclosing function, and recursively pulls every type reachable \
          from it &mdash; the step that addresses failure mode 01.</div>\
        <div class="code" style="margin-top:10px;"><span class="c">// what the agent receives</span>\n\
<span class="b">static table_t *build_table(index_t n)</span>\n\
   <span class="c">&mdash; 18 lines, full body</span>\n\n\
<span class="c">// types reachable from it, resolved across headers</span>\n\
<span class="v">struct table</span>   <span class="v">typedef table_t</span>   <span class="v">typedef index_t</span></div>\
        <div class="td" style="margin-top:9px;"><b>Measured:</b> mean 1.32 DRV iterations to a validated patch across \
          44 targets, max 5 &mdash; with one build rejection and one PoV rejection in the entire run.</div></div>\
    </div>\
  </div>\
</div>']);

S.push(['Agent ensemble', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">06</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 3</div>\
    <h2 class="title rv">Three agents race.<br><span class="accent">Smallest validated patch wins.</span></h2>\
    <p class="deck-lede rv">Different bug classes favour different fix shapes. Three strategies run in parallel, and among \
      those that clear every gate the <b>smallest</b> diff is selected.</p>\
    <div class="grid3 rv" style="margin-top:20px;">\
      <div class="tile"><div class="num"><span class="pill b">alpha</span> &middot; 5 ITERATIONS</div><div class="th">The Analyst</div>\
        <div class="td">Chain-of-thought: explains why the flaw occurs before writing code. Suited to multi-variable \
          state bugs, integer truncation and underflow.</div></div>\
      <div class="tile"><div class="num"><span class="pill v">beta</span> &middot; 8 ITERATIONS</div><div class="th">The Minimalist</div>\
        <div class="td">Constrained to the smallest valid AST change &mdash; typically a single bounds or null check. \
          Suited to out-of-bounds reads and writes.</div></div>\
      <div class="tile"><div class="num"><span class="pill a">gamma</span> &middot; 5 ITERATIONS</div><div class="th">The SARIF Patcher</div>\
        <div class="td">Driven by static findings: unsafe API replacement, format-string specifiers, \
          deprecated calls.</div></div>\
    </div>\
    <div class="grid2 rv" style="margin-top:14px;gap:14px;">\
      <div class="code">[13:42:01.19] dispatching 3 agents in parallel (max_iter: a=5 b=8 g=5)\n\
[13:42:04.10] <span class="b">[alpha]</span> PATCHED at iteration 1 (1 line changed)\n\
[13:42:04.30] <span class="v">[beta]</span>  pov &mdash; <span class="e">FAIL</span> (underflow still reaches malloc)\n\
[13:42:05.10] <span class="v">[beta]</span>  <span class="a">critic: insufficient_fix</span> &mdash; "0 - 1 wraps before your cast"\n\
[13:42:05.44] <span class="a">[gamma]</span> build &mdash; <span class="e">FAIL</span> (undefined symbol)\n\
[13:42:08.22] <span class="g">Agent alpha produced the winning patch (1 of 3 validated)</span></div>\
      <div>\
        <div class="tile" style="margin-bottom:10px;"><div class="num">ESCALATION POLICY</div><div class="th">Deterministic, not endless</div>\
          <div class="td">Once an agent has proved it cannot emit a byte-exact diff, the policy stops asking and \
            forces a whole-function replacement, spliced by AST range.</div></div>\
        <div class="tile"><div class="num">RESULT</div><div class="th">Small, reviewable diffs</div>\
          <div class="td">Median <b>2 lines</b> changed, mean 3.1, max 11. 100% of patches under 15 lines.</div></div>\
      </div>\
    </div>\
  </div>\
</div>']);

S.push(['Agent Delta', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">07</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 3b &middot; LLM-as-judge</div>\
    <h2 class="title rv">On a gate failure,<br><span class="accent">diagnose &mdash; do not dump.</span></h2>\
    <p class="deck-lede rv">Agent Delta is invoked <b>only when a patch fails a gate</b>, and only when the escalation \
      policy judges the call worth making. It never writes code.</p>\
    <div class="grid2 rv" style="margin-top:20px;gap:18px;align-items:start;">\
      <div>\
        <div class="tile" style="margin-bottom:11px;"><div class="num">INPUT</div><div class="th">The failure, trimmed to what explains it</div>\
          <div class="td">Sanitizer report, compiler diagnostics or failing PoV output &mdash; reduced to the error line, \
            frames naming the target&rsquo;s own source, and the SUMMARY. Naive truncation keeps the shadow-memory banner \
            and discards the diagnosis.</div></div>\
        <div class="tile"><div class="num">OUTPUT</div><div class="th">One structured directive</div>\
          <div class="td">A strict JSON verdict: root cause, what the patch missed, and a \
            <b>single actionable instruction</b> for the next attempt.</div></div>\
      </div>\
      <div>\
        <div class="code" style="font-size:11.5px;">{\n\
  "verdict": <span class="e">"insufficient_fix"</span>,\n\
  "root_cause": "The cast happens after the\n\
                 subtraction, so 0 - 1 wraps first.",\n\
  "what_the_patch_missed": "n is already underflowed by\n\
                 the time it reaches the cast.",\n\
  "actionable_instruction": <span class="g">"Bounds-check n against\n\
     SIZE_MAX / sizeof(entry_t) BEFORE the\n\
     subtraction."</span>\n\
}</div>\
        <div class="tile hl" style="margin-top:11px;"><div class="num">WHY WORKING MEMORY EXISTS</div><div class="th">Agents oscillate without it</div>\
          <div class="td">An agent that only sees the latest rejection cycles between two already-refused fixes until its \
            budget runs out. The ledger shows every prior attempt, the gate that rejected each, and the critic&rsquo;s \
            verdict &mdash; at once.</div></div>\
      </div>\
    </div>\
  </div>\
</div>']);

S.push(['DRV loop', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">08</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 4 &middot; Detect-Repair-Verify</div>\
    <h2 class="title rv">Five gates.<br><span class="accent">Each reports what it actually ran.</span></h2>\
    <p class="deck-lede rv">Every iteration builds a <b>fresh isolated workspace</b>, applies the patch to that copy, and \
      compiles it. The exploit is then replayed against the <b>newly built patched binary</b>.</p>\
    <div class="grid2 rv" style="margin-top:18px;gap:20px;align-items:start;">\
      <div>\
        <div class="rowline"><span class="rl">apply</span><span class="rr"><span class="pill g">pass</span> <span class="mono" style="font-size:11px;color:var(--text-3)">diff, content-match, or AST splice</span></span></div>\
        <div class="rowline"><span class="rl">build</span><span class="rr"><span class="pill g">pass</span> <span class="mono" style="font-size:11px;color:var(--text-3)">clang -fsanitize=address,undefined</span></span></div>\
        <div class="rowline"><span class="rl">pov</span><span class="rr"><span class="pill g">pass</span> <span class="mono" style="font-size:11px;color:var(--text-3)">crashing input replayed on patched build</span></span></div>\
        <div class="rowline"><span class="rl">regression</span><span class="rr"><span class="pill g">pass</span> <span class="mono" style="font-size:11px;color:var(--text-3)">benign input produces identical output</span></span></div>\
        <div class="rowline"><span class="rl">post_scan</span><span class="rr"><span class="pill g">pass</span> <span class="mono" style="font-size:11px;color:var(--text-3)">Semgrep: no new findings vs. original</span></span></div>\
        <div class="rowline"><span class="rl">unconfigured</span><span class="rr"><span class="pill a">skipped</span> <b style="font-size:12px">recorded as skipped, never counted as a pass</b></span></div>\
        <div class="tile" style="margin-top:11px;"><div class="td">\
          <b>Measured across the run:</b> 24 PoV gates passed, 14 skipped. Two gate rejections in total &mdash; \
          one at build, one at PoV.</div></div>\
      </div>\
      <div>\
        <div class="code" style="font-size:11.5px;">$ clang -fsanitize=address,undefined \\\n\
    -fno-sanitize-recover=all -g -O1 "{src}" -o "{bin}"\n\
<span class="g">[ok] exit 0 &middot; 1.31s</span>\n\n\
$ ./pov_runner.sh "{bin}" crashes/underflow.bin\n\
<span class="g">[ok] exit 0 &middot; no sanitizer report</span>\n\
<span class="c">(the same input crashed the unpatched build)</span>\n\n\
$ make check\n\
<span class="g">[ok] exit 0 &middot; output identical to original</span></div>\
        <div class="tile hl" style="margin-top:11px;"><div class="num">WHY REBUILD AND REPLAY</div><div class="th">Compilers are the oracle</div>\
          <div class="td">An LLM saying &ldquo;fixed&rdquo; is a claim. A sanitizer staying silent on the same input against a \
            freshly compiled binary is a measurement. Every result in this deck is the second kind.</div></div>\
      </div>\
    </div>\
  </div>\
</div>']);

S.push(['Concolic', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">09</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 5 &middot; self-gated</div>\
    <h2 class="title rv">Built it. Tested it.<br><span class="accent">It disabled itself.</span></h2>\
    <p class="deck-lede rv">Coverage-guided fuzzing stalls on hard magic-value comparisons &mdash; \
      <span class="mono">if (header-&gt;magic == 0x4b415641)</span> has roughly a one-in-four-billion chance of random \
      discovery. Concolic execution solves those branches symbolically instead.</p>\
    <div class="grid3 rv" style="margin-top:20px;">\
      <div class="tile"><div class="num">COMPONENT 01</div><div class="th">Plateau monitor</div>\
        <div class="td">Watches fuzzer coverage logs and detects when no new paths appear across N execution cycles.</div></div>\
      <div class="tile"><div class="num">COMPONENT 02</div><div class="th">angr + Z3 solver</div>\
        <div class="td">Symbolically executes to the stalled branch, solves for the exact byte sequence that satisfies it, \
          and injects the result back into the fuzzer queue.</div></div>\
      <div class="tile ok"><div class="num">COMPONENT 03</div><div class="th">Self-test gate</div>\
        <div class="td">At startup Driller runs a known-answer binary requiring the input <b>KAVA</b>. \
          If the solver cannot recover it, Driller <b>disables itself</b> and logs the platform reason.</div></div>\
    </div>\
    <div class="grid2 rv" style="margin-top:14px;gap:14px;">\
      <div class="code"><span class="c"># recorded in benchmark_summary.json</span>\n\
"concolic_driller_usable": <span class="e">false</span>,\n\
"concolic_driller_detail": "angr reached the branch but\n\
  could not tie the symbolic input to the\n\
  comparison (recovered zeros, expected\n\
  KAVA). Concolic results on this platform\n\
  would be meaningless, so Driller is\n\
  disabled. angr is reliable on x86-64 ELF;\n\
  this host is AARCH64 MachO."</div>\
      <div class="tile ok"><div class="num">WHY THIS SLIDE EXISTS</div><div class="th">A disabled component is a result</div>\
        <div class="td">Symbolic execution across CPU architectures can produce <b>false solutions</b>. Feeding invalid \
          solved inputs into the pipeline would corrupt every downstream measurement. Rather than hide the limitation, \
          the system detects it at startup and turns itself off &mdash; so Phase 5 contributes nothing to the headline \
          numbers, and those numbers remain clean.</div></div>\
    </div>\
  </div>\
</div>']);

S.push(['Hardening', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">10</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 6 &middot; falsification</div>\
    <h2 class="title rv">Then we try to break<br><span class="accent">our own patches.</span></h2>\
    <p class="deck-lede rv">Passing five gates proves one input no longer crashes. It does not prove the fix is correct. \
      Phase 6 attempts to <b>falsify</b> each validated patch. These checks cannot prove a patch correct &mdash; \
      they can only expose one that is not.</p>\
    <div class="grid4 rv" style="margin-top:18px;">\
      <div class="tile"><div class="num">01</div><div class="th">Adversarial re-fuzz</div>\
        <div class="td">Rebuilds the <b>patched</b> source into the fuzz harness for 20s, seeded with the original crash. \
          A new crash means the fix addressed one input, not the defect.</div>\
        <div style="margin-top:auto;padding-top:8px;"><span class="pill r">catches overfits</span></div></div>\
      <div class="tile"><div class="num">02</div><div class="th">Differential execution</div>\
        <div class="td">Original and patched side by side across 25 benign inputs, comparing stdout, stderr and exit code \
          wherever the original did not crash.</div>\
        <div style="margin-top:auto;padding-top:8px;"><span class="pill r">catches gutting</span></div></div>\
      <div class="tile"><div class="num">03</div><div class="th">Behavioural contracts</div>\
        <div class="td"><b>preserve</b> for memory-safety fixes; <b>restrict</b> where remediation legitimately narrows \
          the input domain; <b>replace</b> where the fix changes a compiled-in value. Differential testing is bypassed \
          for the latter two.</div>\
        <div style="margin-top:auto;padding-top:8px;"><span class="pill a">prevents false rejections</span></div></div>\
      <div class="tile"><div class="num">04</div><div class="th">Evasion battery</div>\
        <div class="td">For <b>restrict</b> targets, replays bypass encodings \
          (<span class="mono">....//</span>, <span class="mono">sub/../../</span>). Reports \
          <b>inconclusive</b> if legitimate access breaks, so a patch that rejects everything cannot score as hardened.</div>\
        <div style="margin-top:auto;padding-top:8px;"><span class="pill r">catches incomplete validation</span></div></div>\
    </div>\
    <div class="tile rv" style="margin-top:13px;flex-direction:row;align-items:center;gap:16px;">\
      <div style="flex:1;"><div class="td"><b>Measured, reported as separate numbers:</b> 31 of 38 patched targets were \
        attacked; <b>0 were falsified</b>; 26 are counted as hardened-and-survived. Five produced no applicable \
        falsification evidence &mdash; three by behavioural contract, two where the differential test compared zero inputs &mdash; \
        and are reported <b>NOT HARDENED</b> rather than counted as survivors. Seven fuzz-discovered targets have no \
        hardening run recorded.</div></div>\
    </div>\
  </div>\
</div>']);

S.push(['Cheat detector', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">11</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 6 &middot; validated against constructed cheats</div>\
    <h2 class="title rv">We built the two cheats<br><span class="accent">and ran them through it.</span></h2>\
    <p class="deck-lede rv">Three patches, <b>constructed by hand</b> &mdash; no LLM, no mocks &mdash; put through the real \
      hardening engine. The two fakes clear every DRV gate. That is the point of the test.</p>\
    <div class="grid3 rv" style="margin-top:18px;">\
      <div class="tile crit"><div class="num"><span class="pill r">overfit</span></div><div class="th">Input-specific guard</div>\
        <div class="code" style="margin:7px 0;font-size:11px;"><span class="c">// stop only the PoV input</span>\nif (n == 0x748) return 0;\n<span class="c">// n == 0x749 still overflows</span></div>\
        <div class="td" style="margin-top:auto;padding-top:7px;">build <span class="pill g">pass</span> pov <span class="pill g">pass</span> regr <span class="pill g">pass</span><br>\
          <b style="color:var(--red)">FALSIFIED</b> &mdash; re-fuzz found a new crash at n = 0x749</div></div>\
      <div class="tile crit"><div class="num"><span class="pill r">gutted</span></div><div class="th">Early return</div>\
        <div class="code" style="margin:7px 0;font-size:11px;"><span class="c">// disable the function</span>\nreturn NULL;\n<span class="c">// the bug is still there</span></div>\
        <div class="td" style="margin-top:auto;padding-top:7px;">build <span class="pill g">pass</span> pov <span class="pill g">pass</span> regr <span class="pill g">pass</span><br>\
          <b style="color:var(--red)">FALSIFIED</b> &mdash; differential: 25/25 inputs diverged</div></div>\
      <div class="tile ok"><div class="num"><span class="pill g">honest</span></div><div class="th">Bounds check</div>\
        <div class="code" style="margin:7px 0;font-size:11px;">if (n == 0 || n &gt; SIZE_MAX /\n    sizeof(entry_t)) return NULL;\n<span class="c">// benign inputs unchanged</span></div>\
        <div class="td" style="margin-top:auto;padding-top:7px;">build <span class="pill g">pass</span> pov <span class="pill g">pass</span> regr <span class="pill g">pass</span><br>\
          <b style="color:var(--green)">SURVIVED</b> &mdash; re-fuzz clean, differential clean</div></div>\
    </div>\
    <div class="grid2 rv" style="margin-top:13px;gap:14px;">\
      <div class="tile ok"><div class="num">THE CONTROL</div><div class="th">Read the honest row first</div>\
        <div class="td">A detector that rejects everything is worthless. The honest fix has to survive, or the two \
          rejections prove nothing.</div></div>\
      <div class="tile"><div class="num">IT RUNS AS A CHECK</div><div class="th">Not a one-off demo</div>\
        <div class="td"><span class="mono">python -m tests.cheat_detector.run_cheat_detector</span> exits non-zero if these \
          verdicts ever stop holding. <b>0 API calls, no key required</b> &mdash; the patches are constructed, so the outcome \
          depends only on the verifier.</div></div>\
    </div>\
  </div>\
</div>']);

S.push(['Formal verification', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">12</div>\
  <div class="body">\
    <div class="eyebrow rv">Phase 7 &middot; bounded formal verification</div>\
    <h2 class="title rv">Empirical checks say nothing<br><span class="accent">about inputs nobody tried.</span></h2>\
    <p class="deck-lede rv">Every earlier stage runs the program on inputs we chose. CBMC compiles the patched function into \
      a bit-precise formula and asks a solver whether <b>any</b> assignment of inputs violates bounds, pointer safety or \
      arithmetic overflow.</p>\
    <div class="grid2 rv" style="margin-top:18px;gap:18px;align-items:start;">\
      <div>\
        <div class="tile" style="margin-bottom:10px;"><div class="num">RESULT REPORTING</div><div class="th">Bounded, never &ldquo;correct&rdquo;</div>\
          <div class="td">Loops are unwound K times. <span class="mono">--unwinding-assertions</span> reports when K was \
            insufficient, and such a run is recorded <b>INCONCLUSIVE</b> rather than proven. The bound is printed with \
            every result.</div></div>\
        <div class="tile"><div class="num">SCOPE</div><div class="th">Complementary, not a superset</div>\
          <div class="td">A <span class="mono">memcpy</span> into a struct member is checked at object granularity, so an \
            intra-object overrun verifies as SAFE &mdash; exactly as AddressSanitizer treats it. Absence of a proof harness \
            yields <span class="pill a">unavailable</span>, never a pass.</div></div>\
      </div>\
      <div>\
        <div class="code" style="font-size:11.5px;"><span class="c"># Phase 7 results, this run</span>\n\
proven      <span class="g">3</span> / 38\n\
unavailable <span class="a">28</span> / 38   <span class="c">(no proof harness)</span>\n\n\
<span class="g">PROVEN within unwind=70</span>   SYN-06-OFF-BY-ONE\n\
<span class="g">PROVEN within unwind=16</span>   SYN-11-OOB-MULTIDIM\n\
<span class="g">PROVEN within unwind=20</span>   SYN-12-INT-UNDERFLOW\n\n\
<span class="c"># verification targets a harness, not main()</span>\n\
<span class="c"># running CBMC over main with unconstrained</span>\n\
<span class="c"># argv fails inside its own libc models (strtol)</span></div>\
        <div class="tile hl" style="margin-top:10px;"><div class="num">THE GAP ONLY THIS CLOSES</div><div class="th">A cheat re-fuzzing cannot catch</div>\
          <div class="td">An overfitted patch &mdash; <span class="mono">if (col == 1000000) return -1;</span> &mdash; \
            <b>passes</b> the dynamic PoV gate. CBMC <b>rejects</b> it, on a target that has no fuzz harness, so \
            adversarial re-fuzzing could not have caught it either. Pinned by a regression test.</div></div>\
      </div>\
    </div>\
  </div>\
</div>']);

S.push(['Memory', '\
<div class="slide">\
  <div class="brand-mini"><span class="mk">'+MK+'</span>AI Kavach</div><div class="slide-no">13</div>\
  <div class="body">\
    <div class="eyebrow rv">Four tiers</div>\
    <h2 class="title rv">Only <span class="accent">gate-proven</span> fixes<br>are ever remembered.</h2>\
    <p class="deck-lede rv">The open problem in agent memory is <b>trustworthy reflection</b>: agents store self-assessed \
      lessons that were never checked, and a wrong lesson becomes permanent. This system has ground truth, so it does not \
      have to guess.</p>\

/* ═══ RUNTIME ═══════════════════════════════════════════════════════ */
var idx = 0;
var stage = document.getElementById('stage');

stage.innerHTML = S.map(function(s, i) {
  return s[1].replace('class="slide', 'data-idx="' + i + '" class="slide' + (i === 0 ? ' on' : ''));
}).join('') + '<div class="prog" id="prog"></div>';

document.getElementById('dots').innerHTML = S.map(function(s, i) {
  return '<button class="dot" data-d="' + i + '" title="' + s[0] + '"></button>';
}).join('');

var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

function show(n) {
  idx = Math.max(0, Math.min(S.length - 1, n));
  slides.forEach(function(s, i) { s.classList.toggle('on', i === idx); });
  dots.forEach(function(d, i) { d.classList.toggle('on', i === idx); });
  document.getElementById('counter').textContent =
    String(idx + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0');
  document.getElementById('prog').style.width = ((idx + 1) / S.length * 100) + '%';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === S.length - 1;
}
function go(d) { show(idx + d); }

document.getElementById('prev').addEventListener('click', function() { go(-1); });
document.getElementById('next').addEventListener('click', function() { go(1); });
dots.forEach(function(d) {
  d.addEventListener('click', function() { show(parseInt(d.dataset.d, 10)); });
});

document.addEventListener('keydown', function(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); go(-1); }
  else if (k === 'Home') { e.preventDefault(); show(0); }
  else if (k === 'End') { e.preventDefault(); show(S.length - 1); }
  else if (k === 'f' || k === 'F') { toggleFullscreen(); }
  else if (k === 'p' || k === 'P') { window.print(); }
});

function fit() {
  var vp = document.querySelector('.viewport');
  var s = Math.min((vp.clientWidth - 40) / 1280, (vp.clientHeight - 40) / 720);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

function toggleFullscreen() {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
document.getElementById('fs').addEventListener('click', toggleFullscreen);

function toggleTheme() {
  var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('kavach-deck-theme', next); } catch (e) {}
}
document.getElementById('theme').addEventListener('click', toggleTheme);
try { var t = localStorage.getItem('kavach-deck-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

fit();
show(0);
</script>
