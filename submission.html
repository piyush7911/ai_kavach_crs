var idx = 0;
var stage = document.getElementById('stage');

stage.innerHTML = S.map(function(s, i) {
  return s[1].replace('class="slide', 'data-idx="' + i + '" class="slide' + (i === 0 ? ' on' : ''));
}).join('') + '<div class="prog" id="prog"></div>';

document.getElementById('dots').innerHTML = S.map(function(s, i) {
  return '<button class="dot" data-d="' + i + '" title="' + s[0] + '"></button>';
}).join('');

var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

function show(n) {
  idx = Math.max(0, Math.min(S.length - 1, n));
  slides.forEach(function(s, i) { s.classList.toggle('on', i === idx); });
  dots.forEach(function(d, i) { d.classList.toggle('on', i === idx); });
  document.getElementById('counter').textContent = (idx + 1) + ' / ' + S.length;
  document.getElementById('prog').style.width = ((idx + 1) / S.length * 100) + '%';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === S.length - 1;
}
function go(d) { show(idx + d); }

document.getElementById('prev').addEventListener('click', function() { go(-1); });
document.getElementById('next').addEventListener('click', function() { go(1); });
dots.forEach(function(d) {
  d.addEventListener('click', function() { show(parseInt(d.dataset.d, 10)); });
});

document.addEventListener('keydown', function(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); go(-1); }
  else if (k === 'Home') { e.preventDefault(); show(0); }
  else if (k === 'End') { e.preventDefault(); show(S.length - 1); }
  else if (k === 'f' || k === 'F') { toggleFullscreen(); }
  else if (k === 'p' || k === 'P') { window.print(); }
});

function fit() {
  var vp = document.querySelector('.viewport');
  var s = Math.min((vp.clientWidth - 36) / 1280, (vp.clientHeight - 36) / 720);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

function toggleFullscreen() {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen && document.exitFullscreen(); }
}
document.getElementById('fs').addEventListener('click', toggleFullscreen);

function toggleTheme() {
  var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('kavach-sub-theme', next); } catch (e) {}
}
document.getElementById('theme').addEventListener('click', toggleTheme);
try { var t = localStorage.getItem('kavach-sub-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

fit();
show(0);
</script>
