      --amber: #FBBF24;
      --amber-bg: rgba(251, 191, 36, .08);

      --amber-fg: #2A1C02;
      --blue: #60A5FA;
      --blue-bg: rgba(96, 165, 250, .08);

      --shadow-lg: 0 16px 40px rgba(0, 0, 0, .6), 0 2px 8px rgba(0, 0, 0, .4);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);

      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button {
      font-family: inherit;

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    ::selection {
      background: rgba(29, 78, 216, .16);
    }

    [data-theme="dark"] ::selection {
      background: rgba(96, 165, 250, .24);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-2);
      border-radius: 6px;
      border: 3px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {

    }

    :focus-visible {
      outline: 2px solid var(--blue);

    }

    .app {

    }

    /* --- concept banner -------------------------------------------------
   This file is a UI mock. Every repository, scan, finding, sanitizer
   report and cost figure in it is invented. The banner exists so that
   cannot be mistaken for a running system when the page is shown or
   screenshotted. Do not remove it. */
    .concept-banner {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      box-sizing: border-box;
      background: #7c2d12;
      color: #fff;
      font-size: 12px;
      letter-spacing: .01em;
      border-bottom: 1px solid rgba(0, 0, 0, .25);
    }

    .concept-banner b {
      font-weight: 650;
    }

    .concept-banner .tag {
      font-family: var(--mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .08em;
      background: rgba(255, 255, 255, .16);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .concept-banner a {
      color: #fff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .app {
      height: calc(100vh - 34px);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand .mark {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
      display: grid;
      place-items: center;
    }

    .brand .mark svg {
      width: 14px;
      height: 14px;
    }

    .brand .word {
      font-weight: 620;
      letter-spacing: -.015em;
      font-size: 13.5px;
    }

    .brand .ver {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-3);
    }

    .tb-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .spacer {
      flex: 1;
    }

    .tb-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }

    .tb-meta b {
      color: var(--text-2);
      font-weight: 500;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--r-sm);
      display: grid;
      place-items: center;
      color: var(--text-3);
      transition: background var(--dur), color var(--dur);
    }

    .icon-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .icon-btn svg {
      width: 15px;
      height: 15px;
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--surface-3);
      color: var(--text-2);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
    }

    .shell {
      display: grid;
      grid-template-columns: 210px 1fr;
      min-height: 0;
    }

    .rail {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 12px 9px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .rail .lbl {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-4);
      font-weight: 600;
      padding: 14px 8px 5px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      border-radius: var(--r-sm);
      color: var(--text-2);
      font-size: 13px;
      transition: background var(--dur), color var(--dur);
      width: 100%;
      text-align: left;
    }

    .nav-item svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: .75;
    }

    .nav-item:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item.on {
      background: var(--surface-2);
      color: var(--text);
      font-weight: 550;
    }

    .nav-item.on svg {
      opacity: 1;
    }

    .nav-item .n {
      flex: 1;
    }

    .nav-item .c {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-4);
    }

    .nav-item .live-i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.6s var(--ease) infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .3;
      }
    }

    .rail-card {
      margin: 12px 2px 0;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .rail-card .t {
      font-size: 10px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-4);
      font-weight: 600;
    }

    .rail-card .v {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.02em;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .rail-card .d {
      font-size: 11px;
      color: var(--text-3);
      margin-top: 2px;
      line-height: 1.4;
    }

    .viewport {
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 26px 30px 70px;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
    }

    .page-head .txt {
      flex: 1;
    }

    .page-head h1 {
      font-size: 20px;
      font-weight: 620;
      letter-spacing: -.025em;
      margin: 0;
    }

    .page-head .sub {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 3px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
    }

    .card.pad {
      padding: 16px 18px;
    }

    .card.flush {
      overflow: hidden;
    }

    .card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card-head h3 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
    }

    .card-head .sp {
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px 13px;
      border-radius: var(--r-sm);
      font-size: 12.5px;
      font-weight: 500;
      border: 1px solid var(--border-2);
      background: var(--surface);
      color: var(--text);
      transition: background var(--dur), border-color var(--dur), transform var(--dur);
    }

    .btn:hover {
      background: var(--surface-2);
      border-color: var(--text-4);
    }

    .btn:active {
      transform: translateY(.5px);
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn.primary {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
      font-weight: 550;
    }

    .btn.primary:hover {
      opacity: .88;
      background: var(--text);
    }

    .btn.danger {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      font-weight: 550;
    }

    .btn.danger:hover {
      opacity: .88;
      background: var(--red);
    }

    .btn.ghost {
      border-color: transparent;
      background: none;
      color: var(--text-2);
    }

    .btn.ghost:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      font-family: var(--mono);
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .tag.green {
      background: var(--green-bg);
      color: var(--green);
      border-color: var(--green-br);
    }

    .tag.red {
      background: var(--red-bg);
      color: var(--red);
      border-color: var(--red-br);
    }

    .tag.amber {
      background: var(--amber-bg);
      color: var(--amber);
      border-color: var(--amber-br);
    }

    .tag.blue {
      background: var(--blue-bg);
      color: var(--blue);
      border-color: var(--blue-br);
    }

    .tag.violet {
      background: var(--violet-bg);
      color: var(--violet);
      border-color: var(--violet-br);
    }

    .tag.neutral {
      background: var(--surface-2);
      color: var(--text-3);
      border-color: var(--border);
    }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
    }

    .tnum {
      font-variant-numeric: tabular-nums;
    }

    /* stats */
    .stats {
      display: grid;
      gap: 12px;
    }

    .stats.c4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .stats.c3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .stat {
      padding: 15px 17px;
    }

    .stat .l {
      font-size: 10.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat .v {
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -.03em;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .stat .v .u {
      font-size: 14px;
      color: var(--text-4);
      font-weight: 500;
    }

    .stat .d {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 3px;
    }

    .stat .d.up {
      color: var(--green);
    }

    .stat .d.dn {
      color: var(--red);
    }

    .stat.g .v {
      color: var(--green);
    }

    .stat.r .v {
      color: var(--red);
    }

    .stat.a .v {
      color: var(--amber);
    }

    .stat.b .v {
      color: var(--blue);
    }

    /* progress */
    .bar {
      height: 5px;
      background: var(--surface-3);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar>i {
      display: block;
      height: 100%;
      border-radius: 3px;
      background: var(--text);
      transition: width .5s var(--ease);
    }

    .bar.run>i {
      background: linear-gradient(90deg, var(--blue), var(--violet));
      background-size: 200% 100%;
      animation: flow 1.6s linear infinite;
    }

    @keyframes flow {
      to {
        background-position: -200% 0;
      }
    }

    .bar.g>i {
      background: var(--green);
    }

    .bar.r>i {
      background: var(--red);
    }

    /* table */
    table.d {
      width: 100%;
      border-collapse: collapse;
    }

    table.d th {
      text-align: left;
      font-size: 10.5px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    table.d td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
      color: var(--text-2);
    }

    table.d tbody tr {
      transition: background var(--dur);
    }

    table.d tbody tr.clickable {
      cursor: pointer;
    }

    table.d tbody tr:hover {
      background: var(--surface-2);
    }

    table.d tbody tr:hover td {
      color: var(--text);
    }

    table.d tbody tr:last-child td {
      border-bottom: 0;
    }

    table.d td.id {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--blue);
    }

    table.d td.m {
      font-family: var(--mono);
      font-size: 11.5px;
    }

    table.d .act {
      opacity: 0;
      transition: opacity var(--dur);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-3);
    }

    table.d tr:hover .act {
      opacity: 1;
    }

    /* filters */
    .filters {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .chip {
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--text-2);
      transition: all var(--dur);
    }

    .chip:hover {
      border-color: var(--border-2);
      color: var(--text);
    }

    .chip.on {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
      font-weight: 550;
    }

    .chip .ct {
      font-family: var(--mono);
      font-size: 10.5px;
      opacity: .6;
      margin-left: 4px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      background: var(--surface-2);
    }

    .search svg {
      width: 13px;
      height: 13px;
      color: var(--text-4);
      flex-shrink: 0;
    }

    .search input {
      border: 0;
      outline: 0;
      background: none;
      width: 220px;
      font-size: 12.5px;
    }

    .search input::placeholder {
      color: var(--text-4);
    }

    /* wizard */
    .wiz {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 22px;
    }

    .wiz .ws {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wiz .wn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--border-2);
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-4);
      background: var(--surface);
    }

    .wiz .wt {
      font-size: 13px;
      color: var(--text-3);
    }

    .wiz .ws.done .wn {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .wiz .ws.done .wt {
      color: var(--text-2);
    }

    .wiz .ws.on .wn {
      border-color: var(--text);
      color: var(--text);
    }

    .wiz .ws.on .wt {
      color: var(--text);
      font-weight: 550;
    }

    .wiz .wl {
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 14px;
    }

    .wiz .wl.done {
      background: var(--text);
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-3);
      font-weight: 600;
      margin-bottom: 5px;
    }

    .field .hint {
      font-size: 11.5px;
      color: var(--text-4);
      margin-top: 4px;
      line-height: 1.45;
    }

    .inp,
    .txta,
    .sel {
      width: 100%;
      padding: 8px 11px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color var(--dur), box-shadow var(--dur);
    }

    .inp:focus,
    .txta:focus,
    .sel:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, .10);
    }

    .txta {
      min-height: 68px;
      resize: vertical;
      line-height: 1.55;
    }

    .sel {
      font-family: var(--sans);
      font-size: 12.5px;
      cursor: pointer;
    }

    .tok {
      color: var(--blue);
    }

    .switch-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);

          '<textarea class="txta" id="w-build">' + esc(wiz.build) + '</textarea>' +
          '<div class="hint">Placeholders: <span class="tok">{src}</span> <span class="tok">{srcdir}</span> <span class="tok">{bin}</span> <span class="tok">{workspace}</span> — resolved against the patched copy, so gates test the patch, not the original.</div>' +
          '</div>' +
          '<div class="field"><label>Proof-of-vulnerability command</label>' +
          '<textarea class="txta" id="w-pov">' + esc(wiz.pov) + '</textarea>' +
          '<div class="hint">Must exit <b>0 only when the vulnerability is absent</b>. Without it the PoV gate reports SKIPPED and fixes cannot be proven.</div>' +
          '</div>' +
          '<div class="field"><label>Regression command</label><input class="inp" id="w-regr" value="' + esc(wiz.regr) + '" />' +

          '<div class="card pad" style="margin-top:6px;background:var(--surface-2);">' +
          '<div style="display:flex;align-items:center;gap:10px;">' +
          '<span style="font-size:12.5px;font-weight:600;flex:1;">Pre-flight check</span>' +
          '<button class="btn sm" id="preflight-btn">' + (preflightState === 'done' ? 'Re-run' : 'Run check') + '</button>' +
          '</div>' +
          '<div class="hint" style="margin-top:4px;">Compiles the <b>unpatched</b> target and confirms the PoV reproduces a clean sanitizer crash. A scan cannot start until this passes.</div>' +
          (preflightState !== 'idle' ? '<pre class="ev" style="margin-top:10px;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--mono);font-size:11.5px;white-space:pre;overflow-x:auto;color:var(--text-2);">' +

            '<span style="color:var(--green)">[ok] build exit 0 · 1.24s</span>\n' +
            '$ sh tests/pov/run.sh /tmp/pf/t\n' +
            '<span style="color:var(--red)">==90412==ERROR: AddressSanitizer: heap-buffer-overflow</span>\n' +
            '<span style="color:var(--blue)">    #0 0x10a3b4c1f in decode_frame src/codec/frame.c:154</span>\n' +
            '<span style="color:var(--red)">SUMMARY: AddressSanitizer: heap-buffer-overflow src/codec/frame.c:154</span>\n' +
            '<span style="color:var(--green)">[ok] PoV reproduces · crash class=heap-buffer-overflow · CWE-787</span>' +
            '</pre>' : '') +
          '</div>';
      } else {
        body =
          '<div style="margin-bottom:6px;">' +
          '<div class="switch-row"><div class="sw ' + (wiz.fuzz ? 'on' : '') + '" data-sw="fuzz"><i></i></div>' +
          '<div class="sw-txt"><div class="n">Coverage-guided fuzzing</div>' +
          '<div class="d">Builds the target under ASan+UBSan and runs a real libFuzzer campaign. Finds bugs static analysis misses — this is what discovered 7 of the 11 findings in the last rtos-netstack scan.</div></div></div>' +
          '<div class="switch-row"><div class="sw ' + (wiz.harden ? 'on' : '') + '" data-sw="harden"><i></i></div>' +
          '<div class="sw-txt"><div class="n">Phase 6 — patch hardening</div>' +
          '<div class="d">Re-fuzzes the patched build and differential-tests it against the original, to catch patches that only turned the gates green. <b>Recommended always on.</b></div></div></div>' +
          '<div class="switch-row"><div class="sw ' + (wiz.formal ? 'on' : '') + '" data-sw="formal"><i></i></div>' +
          '<div class="sw-txt"><div class="n">Bounded formal verification (CBMC)</div>' +
          '<div class="d">Discharges safety properties where a proof harness exists. Slower; only applies to some targets.</div></div></div>' +
          '<div class="switch-row"><div class="sw ' + (wiz.memory ? 'on' : '') + '" data-sw="memory"><i></i></div>' +
          '<div class="sw-txt"><div class="n">Cross-run memory recall</div>' +
          '<div class="d">Recalls fix patterns proven on previous scans. Only gate-validated fixes are ever learned.</div></div></div>' +
          '</div>' +
          '<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;">' +
          '<div class="field"><label>Concurrency</label>' +
          '<select class="sel" id="w-conc">' + [1, 2, 4, 8].map(function (n) {
            return '<option' + (wiz.concurrency === n ? ' selected' : '') + '>' + n + ' target' + (n > 1 ? 's' : '') + ' in parallel</option>';
          }).join("") + '</select></div>' +
          '<div class="field"><label>Spend cap for this scan</label>' +
          '<select class="sel" id="w-budget">' + [2, 5, 10, 25].map(function (n) {
            return '<option' + (wiz.budget === n ? ' selected' : '') + '>$' + n + '</option>';
          }).join("") + '</select>' +

          '</div>';
      }

      return '<div class="wrap">' +
        '<div class="page-head"><div class="txt"><h1>New scan</h1>' +
        '<div class="sub">Point AI Kavach at a repository. It will find memory-safety defects, generate patches for each, and prove the fixes hold.</div></div></div>' +

        '<div class="wiz">' + steps.map(function (s, i) {
          var cls = i + 1 < wizStep ? 'done' : i + 1 === wizStep ? 'on' : '';
          return '<div class="ws ' + cls + '"><span class="wn">' + (i + 1 < wizStep ? '✓' : s[0]) + '</span>' +
            '<span class="wt">' + s[1] + '</span></div>' +
            (i < 2 ? '<span class="wl ' + (i + 1 < wizStep ? 'done' : '') + '"></span>' : '');
        }).join("") + '</div>' +

        '<div class="card pad" style="max-width:820px;">' + body + '</div>' +

        '<div style="display:flex;gap:9px;margin-top:18px;max-width:820px;">' +
        (wizStep > 1 ? '<button class="btn" id="w-back">' + I.back + ' Back</button>' : '') +
        '<span style="flex:1;"></span>' +
        (wizStep < 3 ? '<button class="btn primary" id="w-next">Continue</button>'
          : '<button class="btn primary" id="w-launch">' + I.play + ' Start scan</button>') +
        '</div>' +
        '</div>';
    };

    /* ── SCANS ─────────────────────────────────────────────────────────── */
    V.scans = function () {
      return '<div class="wrap">' +
        '<div class="page-head"><div class="txt"><h1>Scans</h1>' +
        '<div class="sub">Every run, with its cost, findings and outcome. Click a running scan to watch it live.</div></div>' +
        '<button class="btn primary" data-go="newscan">' + I.plus + ' New scan</button></div>' +

        '<div class="card flush"><table class="d">' +
        '<thead><tr><th>Scan</th><th>Target</th><th>Status</th><th>Progress</th><th>Findings</th><th>Duration</th><th>Cost</th><th>Trigger</th><th></th></tr></thead><tbody>' +
        SCANS.map(function (s) {
          var st = s.status === 'running' ? '<span class="tag blue">running</span>'

            '<td>' + bar + '</td>' +
            '<td class="m">' + (s.findings || '—') + '</td>' +
            '<td class="m">' + (s.durMin ? s.durMin + ' min' : ago(s.startMin)) + '</td>' +
            '<td class="m">$' + s.cost.toFixed(4) + '</td>' +
            '<td class="m">' + s.trigger + '</td>' +
            '<td><span class="act">' + (s.status === 'running' ? 'watch →' : 'open →') + '</span></td></tr>';
        }).join("") +
        '</tbody></table></div>' +
        '</div>';
    };

    /* ── LIVE RUN ──────────────────────────────────────────────────────── */
    V.run = function () {
      var s = SCANS.filter(function (x) { return x.id === openScan; })[0];
      if (!s) return '<div class="wrap">Not found</div>';
      var STAGES = [
        ['Detecting', s.progress > 8],
        ['Triaging crashes', s.progress > 20],
        ['Extracting context', s.progress > 30],
        ['Agent ensemble', s.progress > 40],
        ['DRV verification', s.progress > 55],
        ['Phase 6 hardening', s.progress > 74],
        ['Writing memory', s.progress > 92]
      ];
      var running = s.status === 'running';
      var curStage = STAGES.filter(function (x) { return x[1]; }).length;
      var live = FINDINGS.filter(function (f) { return f.scan === s.id; });

      return '<div class="wrap">' +
        '<div class="page-head"><div class="txt">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
        '<button class="btn sm ghost" data-go="scans">' + I.back + '</button>' +
        '<h1 style="font-family:var(--mono);font-size:17px;">' + s.id + '</h1>' +
        '<span class="tag ' + (running ? 'blue' : s.status === 'completed' ? 'green' : s.status === 'failed' ? 'red' : 'neutral') + '">' + s.status + '</span>' +
        '<span class="mono" style="color:var(--text-3);font-size:12px;">' + esc(s.target) + '</span>' +
        '</div>' +
        '<div class="sub">Started ' + ago(s.startMin) + ' · ' + s.trigger + ' · by ' + s.user + '</div>' +
        '</div>' +
        (running ? '<button class="btn danger" id="cancel-run">Cancel scan</button>'
          : '<button class="btn" id="rerun-run">' + I.play + ' Re-run</button>') +
        '</div>' +

        '<div class="run-hero">' +
        '<div class="card pad">' +
        '<div style="display:flex;align-items:flex-end;gap:16px;">' +
        '<div class="pct">' + s.progress + '<span style="font-size:22px;color:var(--text-4);">%</span></div>' +
        '<div style="flex:1;padding-bottom:6px;">' +
        '<div class="bar ' + (running ? 'run' : 'g') + '" style="height:7px;"><i style="width:' + s.progress + '%"></i></div>' +
        '<div class="mono" style="font-size:11.5px;color:var(--text-3);margin-top:7px;">' +
        (running ? 'Stage ' + (curStage + 1) + ' of 7 · est. ' + Math.max(1, Math.round((100 - s.progress) / 6)) + ' min remaining'
          : s.status === 'completed' ? 'Completed in ' + s.durMin + ' min' : 'Stopped at ' + s.progress + '%') +
        '</div>' +
        '</div>' +
        '</div>' +
        '<div class="stages">' + STAGES.map(function (st, i) {
          var active = running && i === curStage;
          var done = st[1];
          return '<div class="srow ' + (done ? 'done' : active ? 'active' : '') + '">' +
            '<span class="ic">' + (done ? I.tick : active ? I.spin : '') + '</span>' +
            '<span class="nm">' + st[0] + '</span>' +
            '<span class="bar" style="height:4px;"><i style="width:' + (done ? 100 : active ? 55 : 0) + '%"></i></span>' +
            '<span class="meta ' + (done ? 'ok' : '') + '">' + (done ? 'done' : active ? 'running' : 'queued') + '</span>' +
            '</div>';
        }).join("") + '</div>' +
        '</div>' +

        '<div style="display:flex;flex-direction:column;gap:12px;">' +
        '<div class="card pad">' +
        '<div class="stat" style="padding:0;"><div class="l">Findings</div>' +
        '<div class="v">' + live.length + '</div>' +
        '<div class="d">' + live.filter(function (f) { return f.status === 'patch-ready'; }).length + ' patch-ready · ' +
        live.filter(function (f) { return f.status === 'triaging'; }).length + ' triaging</div></div>' +
        '</div>' +
        '<div class="card pad">' +
        '<div class="stat" style="padding:0;"><div class="l">Spend</div>' +
        '<div class="v">$' + s.cost.toFixed(4) + '</div>' +
        '<div class="d">cap $' + (wiz.budget) + ' · ' + (s.cost / wiz.budget * 100).toFixed(1) + '% used</div></div>' +
        '<div class="bar" style="margin-top:8px;"><i style="width:' + Math.min(100, s.cost / wiz.budget * 100).toFixed(0) + '%"></i></div>' +
        '</div>' +
        '<div class="card pad">' +
        '<div class="stat" style="padding:0;"><div class="l">Agents active</div>' +
        '<div class="v">' + (running ? 3 : 0) + '<span class="u">/ 3</span></div>' +
        '<div class="d">alpha · beta · gamma</div></div>' +
        '</div>' +
        '</div>' +
        '</div>' +

        '<div style="display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px;align-items:start;">' +
        '<div class="term">' +
        '<div class="th"><span style="width:6px;height:6px;border-radius:50%;background:' + (running ? 'var(--green)' : 'var(--text-4)') + ';display:inline-block;"></span>' +
        'live output<span style="flex:1;"></span>' + (running ? '' : '<span>stream ended</span>') + '</div>' +
        '<pre class="tb" id="runlog"></pre>' +
        '</div>' +

        '<div class="card flush">' +
        '<div class="card-head"><h3>Findings as they land</h3><span class="sp"></span>' +
        '<span class="mono" style="font-size:11px;color:var(--text-3);">' + live.length + '</span></div>' +
        '<div id="live-findings">' + live.map(function (f) {
          return '<div class="finding-pop" data-open-finding="' + f.id + '" style="cursor:pointer;">' +
            '<span class="tag ' + (f.sev === 'CRITICAL' ? 'red' : f.sev === 'HIGH' ? 'amber' : 'neutral') + '">' + f.sev.slice(0, 4) + '</span>' +
            '<span class="fi">' + esc(f.file) + ':' + f.line + '</span>' +
            '<span class="tag ' + (f.status === 'patch-ready' ? 'green' : 'neutral') + '">' + f.status + '</span>' +
            '</div>';
        }).join("") + '</div>' +
        '</div>' +
        '</div>' +
        '</div>';
    };

    /* ── FINDINGS ──────────────────────────────────────────────────────── */
    V.findings = function () {
      if (openFinding) return findingDetail(openFinding);
      var list = FINDINGS.filter(function (f) {
        if (fFilter === 'open' && (f.status === 'closed' || f.status === 'false-positive')) return false;
        if (fFilter === 'ready' && f.status !== 'patch-ready') return false;
        if (fFilter === 'patching' && f.status !== 'patching') return false;
        if (fFilter === 'triaging' && f.status !== 'triaging') return false;
        if (fFilter === 'critical' && f.sev !== 'CRITICAL') return false;
        if (fQuery) {
          var q = fQuery.toLowerCase();
          if ((f.id + f.target + f.cwe + f.file).toLowerCase().indexOf(q) === -1) return false;
        }
        return true;
      });
      var counts = {
        all: FINDINGS.length,
        open: FINDINGS.filter(function (f) { return f.status !== 'closed' && f.status !== 'false-positive'; }).length,
        ready: FINDINGS.filter(function (f) { return f.status === 'patch-ready'; }).length,
        patching: FINDINGS.filter(function (f) { return f.status === 'patching'; }).length,
        triaging: FINDINGS.filter(function (f) { return f.status === 'triaging'; }).length,
        critical: FINDINGS.filter(function (f) { return f.sev === 'CRITICAL'; }).length
      };

      return '<div class="wrap">' +
        '<div class="page-head"><div class="txt"><h1>Findings</h1>' +
        '<div class="sub">' + counts.open + ' open across ' + TARGETS.length + ' repositories. Click any row for the full evidence chain.</div></div>' +
        '<button class="btn" id="export-csv">' + I.down + ' Export CSV</button></div>' +

        '<div class="filters">' +
        [['all', 'All'], ['open', 'Open'], ['critical', 'Critical'], ['ready', 'Patch ready'], ['patching', 'Patching'], ['triaging', 'Triaging']].map(function (f) {
          return '<button class="chip ' + (fFilter === f[0] ? 'on' : '') + '" data-ff="' + f[0] + '">' + f[1] +
            '<span class="ct">' + counts[f[0]] + '</span></button>';
        }).join("") +
        '<span style="flex:1;"></span>' +
        '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
        '<input id="fq" placeholder="Filter by file, CWE, target…" value="' + esc(fQuery) + '" /></div>' +
        '</div>' +

        (list.length ? '<div class="card flush"><table class="d">' +
          '<thead><tr><th>Finding</th><th>Severity</th><th>CWE</th><th>Location</th><th>Found by</th><th>Status</th><th>PoV</th><th>Patch</th><th>Hardened</th><th></th></tr></thead><tbody>' +
          list.map(function (f) {
            var st = f.status === 'patch-ready' ? '<span class="tag green">patch ready</span>'
              : f.status === 'patching' ? '<span class="tag blue">patching</span>'
                : f.status === 'triaging' ? '<span class="tag amber">triaging</span>'
                  : f.status === 'closed' ? '<span class="tag neutral">closed</span>'
                    : '<span class="tag neutral">false positive</span>';
            return '<tr class="clickable" data-open-finding="' + f.id + '">' +
              '<td class="id">' + f.id + '<div class="mono" style="font-size:10.5px;color:var(--text-4);margin-top:1px;">' + esc(f.target) + ' · ' + f.scan + '</div></td>' +
              '<td><span class="tag ' + (f.sev === 'CRITICAL' ? 'red' : f.sev === 'HIGH' ? 'amber' : f.sev === 'MEDIUM' ? 'blue' : 'neutral') + '">' + f.sev + '</span></td>' +
              '<td class="m">' + f.cwe + '</td>' +
              '<td class="m">' + esc(f.file) + ':' + f.line + '</td>' +
              '<td class="m">' + (f.by === 'fuzzer' ? 'fuzzing' : 'static') + '</td>' +
              '<td>' + st + '</td>' +
              '<td><span class="tag ' + (f.pov === 'proven' ? 'green' : 'amber') + '">' + (f.pov === 'proven' ? 'proven' : 'none') + '</span></td>' +
              '<td class="m">' + (f.lines ? f.lines + ' lines' : '—') + '</td>' +
              '<td class="m">' + (f.hardened === 'survived' ? 'yes' : '—') + '</td>' +
              '<td><span class="act">open →</span></td></tr>';
          }).join("") + '</tbody></table></div>'
          : '<div class="card"><div class="empty">' + I.inbox + '<div class="t">No findings match</div>' +
          '<div class="d">Try a different filter, or start a scan on a repository that has not been scanned yet.</div></div></div>') +
        '</div>';
    };

    /* ── FINDING DETAIL ────────────────────────────────────────────────── */
    var ASAN = {
      'F-0877':
        "==48211==ERROR: AddressSanitizer: heap-buffer-overflow on address 0x60b0000012a4\n" +
        "WRITE of size 4 at 0x60b0000012a4 thread T0\n" +
        "    #0 0x104a7c1e0 in decode_frame src/codec/frame.c:154\n" +
        "    #1 0x104a3b1f8 in LLVMFuzzerTestOneInput harness.c:19\n" +
        "SUMMARY: AddressSanitizer: heap-buffer-overflow src/codec/frame.c:154 in decode_frame",
      'F-0881':
        "==12904==ERROR: AddressSanitizer: heap-buffer-overflow on address 0x607000003ff8\n" +
        "READ of size 2 at 0x607000003ff8 thread T0\n" +
        "    #0 0x10b3c2210 in tls_record_read src/tls/record.c:412\n" +
        "    #1 0x10b3c1f8a in LLVMFuzzerTestOneInput harness.c:22\n" +
        "SUMMARY: AddressSanitizer: heap-buffer-overflow src/tls/record.c:412 in tls_record_read",
      'F-0874':
        "==55210==ERROR: AddressSanitizer: heap-use-after-free on address 0x60300000dead\n" +
        "READ of size 8 at 0x60300000dead thread T0\n" +
        "    #0 0x10cc12a40 in pool_release src/session/pool.c:118\n" +
        "freed by thread T0 here:\n" +
        "    #0 0x10cc12990 in pool_release src/session/pool.c:104\n" +
        "SUMMARY: AddressSanitizer: heap-use-after-free src/session/pool.c:118 in pool_release"
    };
    var DIFFS = {
      'F-0877': [
        ["ctx", "static int decode_frame(frame_t *f, const uint8_t *buf, size_t n)"],
        ["ctx", "{"],
        ["rem", "    size_t count = read_u32(buf + 4);"],
        ["add", "    if (n < 8 || n - 8 < sizeof(uint32_t)) return -EINVAL;"],
        ["add", "    size_t count = read_u32(buf + 4);"],
        ["add", "    if (count > (n - 8) / sizeof(entry_t)) return -EINVAL;"],
        ["ctx", "    for (size_t i = 0; i < count; i++)"],
        ["ctx", "        f->entries[i] = unpack(buf + 8 + i * sizeof(entry_t));"],
        ["ctx", "    return 0;"],
        ["ctx", "}"]
      ],
      'F-0881': [
        ["ctx", "static ssize_t tls_record_read(tls_ctx *c, uint8_t *dst, size_t len)"],
        ["ctx", "{"],
        ["rem", "    uint16_t n = be16(c->hdr + 3);"],
        ["add", "    if (c->hdr_len < 5) return -EPROTO;"],
        ["add", "    uint16_t n = be16(c->hdr + 3);"],
        ["add", "    if (n > len) n = len;"],
        ["ctx", "    memcpy(dst, c->payload, n);"],
        ["ctx", "    return n;"],
        ["ctx", "}"]
      ]
    };

    function findingDetail(id) {
      var f = FINDINGS.filter(function (x) { return x.id === id; })[0];
      if (!f) return '<div class="wrap">Not found</div>';
      var asan = ASAN[id] || ASAN['F-0877'];
      var diff = DIFFS[id] || DIFFS['F-0877'];
      var isReady = f.status === 'patch-ready';

      return '<div class="wrap">' +
        '<div class="page-head"><div class="txt">' +
        '<div style="display:flex;align-items:center;gap:10px;">' +
        '<button class="btn sm ghost" data-back-findings="1">' + I.back + '</button>' +
        '<h1 style="font-family:var(--mono);font-size:17px;">' + f.id + '</h1>' +
        '<span class="tag ' + (f.sev === 'CRITICAL' ? 'red' : f.sev === 'HIGH' ? 'amber' : 'blue') + '">' + f.sev + '</span>' +
        '<span class="tag blue">' + f.cwe + '</span>' +
        '</div>' +
        '<div class="sub">' + esc(f.target) + ' · <span class="mono">' + esc(f.file) + ':' + f.line + '</span> · found by ' + (f.by === 'fuzzer' ? 'coverage-guided fuzzing' : 'static analysis') + ' · ' + ago(f.min) + '</div>' +
        '</div>' +

    /* ═══ RENDER ═════════════════════════════════════════════════════════ */
    function render() {

        var live = n.id === 'scans' && SCANS.some(function (s) { return s.status === 'running'; });
        return '<button class="nav-item ' + (view === n.id || (view === 'run' && n.id === 'scans') ? 'on' : '') + '" data-nav="' + n.id + '">' +

        '<span>local workspace · no data leaves this host</span>';

    /* ═══ WIZARD ═════════════════════════════════════════════════════════ */
    function bindWizard() {
      var next = $('#w-next'), back = $('#w-back'), launch = $('#w-launch');
      if (next) next.addEventListener('click', function () {
        if (wizStep === 1) { var p = $('#w-path'); if (p) wiz.path = p.value; var t = $('#w-target'); if (t) wiz.target = t.value; }
        if (wizStep === 2) { var b = $('#w-build'); if (b) wiz.build = b.value; var pv = $('#w-pov'); if (pv) wiz.pov = pv.value; var r = $('#w-regr'); if (r) wiz.regr = r.value; }
        wizStep++; render();
      });
      if (back) back.addEventListener('click', function () { wizStep--; render(); });
      if (launch) launch.addEventListener('click', function () {
        var c = $('#w-conc'); if (c) wiz.concurrency = parseInt(c.value, 10);
        var b = $('#w-budget'); if (b) wiz.budget = parseInt(String(b.value).replace('$', ''), 10);
        var id = 'S-1043';
        SCANS.unshift({
          id: id, target: (TARGETS.filter(function (t) { return t.id === wiz.target; })[0] || { name: 'libproto' }).name,
          status: 'running', progress: 0, startMin: 0, findings: 0, cost: 0, trigger: 'manual', user: 'pk'
        });
        openScan = id; wizStep = 1; preflightState = 'idle';
        view = 'run';
        toast('Scan ' + id + ' started', 'ok');
        render();
      });
      var pf = $('#preflight-btn');
      if (pf) pf.addEventListener('click', function () {
        pf.disabled = true; pf.textContent = 'Running…';

    /* ═══ LIVE RUN STREAM ════════════════════════════════════════════════ */
    var LOG = [
      ["init", "Scan S-1043 initialised · target libproto · 38 files"],
      ["ok", "pre-flight passed — PoV reproduces on unpatched build"],
      ["info", "Phase 1: Semgrep p/security-audit — 4 findings in 6.2s"],
      ["info", "Phase 1: libFuzzer campaign started (30s budget, 4 workers)"],
      ["er", "crash #1: heap-buffer-overflow src/codec/frame.c:154"],
      ["v", "crash #2: SEGV src/codec/frame.c:201"],
      ["info", "crash #3: heap-use-after-free src/session/pool.c:118 — deduped"],
      ["ok", "triage: 34 crash inputs → 11 distinct bugs"],
      ["info", "Phase 2: tree-sitter extracted 11 functions + 42 types"],
      ["info", "Phase 3: dispatching alpha / beta / gamma on F-0877"],
      ["a", "[alpha] iter 1 — apply pass · build pass · pov pass"],
      ["v", "[beta]  iter 1 — pov FAIL · critic: insufficient_fix"],
      ["er", "[gamma] iter 1 — build FAIL (undefined symbol)"],
      ["ok", "[alpha] PATCHED at iteration 1 · 4 lines"],
      ["info", "Phase 6: re-fuzz 20s on patched build — no new crash"],
      ["ok", "Phase 6: differential 25/25 inputs — behaviour preserved"],
      ["info", "agents working F-0876 · F-0875 · F-0874 …"]
    ];
    var logIdx = 0;
    var streamTimer = null;
    function startRunStream() {
      logIdx = 0;
      // a render on the run view must not leave the previous stream running
      if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
      var box = $('#runlog');
      if (!box) return;
      box.innerHTML = '';
      var s = SCANS.filter(function (x) { return x.id === openScan; })[0];
      if (!s) return;
      var running = s.status === 'running';
      var i = 0;
      var timer = setInterval(function () {
        if (!running || i >= LOG.length) { clearInterval(timer); if (streamTimer === timer) streamTimer = null; return; }
        var row = LOG[i];
        var cls = row[0] === 'ok' ? 'ok' : row[0] === 'er' ? 'er' : row[0] === 'v' ? 'v' : row[0] === 'a' ? 'b' : '';
        var ts = new Date(Date.now() + i * 1800).toTimeString().slice(0, 8);
        box.innerHTML += '<span class="t">[' + ts + ']</span> <span class="' + cls + '">' + esc(row[1]) + '</span>\n';
        box.scrollTop = box.scrollHeight;
        i++;
      }, 420);
      streamTimer = timer;
      var cancel = $('#cancel-run');
      if (cancel) cancel.addEventListener('click', function () {
        s.status = 'cancelled';
        if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
        toast('Scan ' + s.id + ' cancelled', 'warn'); render();
      });
      var rerun = $('#rerun-run');
      if (rerun) rerun.addEventListener('click', function () { toast('Queued a re-run of ' + s.id, 'ok'); });
      startTicker();
    }

    /* global ticker advances any running scan */
    function startTicker() {
      if (ticker) return;
      ticker = setInterval(function () {
        var live = SCANS.filter(function (s) { return s.status === 'running'; });
        if (!live.length) { clearInterval(ticker); ticker = null; return; }
        live.forEach(function (s) {
          s.progress = Math.min(100, s.progress + 1);
          s.cost += 0.00042;
          if (s.progress >= 100) {
            s.status = 'completed'; s.durMin = 14; s.findings = 11;
            toast('Scan ' + s.id + ' completed · 11 findings', 'ok');
          }
          // pop a new finding in at intervals
          if (s.progress % 17 === 0 && s.findings < 11) {
            s.findings++;
            FINDINGS.unshift({
              id: 'F-08' + (90 + s.findings), scan: s.id, target: s.target,
              cwe: 'CWE-125', sev: s.findings % 3 === 0 ? 'CRITICAL' : 'HIGH',
              file: 'src/codec/frame.c', line: 100 + s.findings * 7, status: 'triaging',
              agent: null, lines: 0, pov: 'proven', hardened: null, by: 'fuzzer', min: 0
            });
          }
        });
        if (view === 'run' || view === 'dashboard') render();
      }, 700);
    }

      if (sv) sv.addEventListener('click', function () { toast('Settings saved', 'ok'); });
      var sc = $('[data-sw-sched]');
      if (sc) sc.addEventListener('click', function () { sc.classList.toggle('on'); });
    }

    /* ═══ NAV ════════════════════════════════════════════════════════════ */
    function go(v) { view = v; openFinding = null; render(); }

    document.addEventListener('click', function (e) {
      var nav = e.target.closest('[data-nav]');
      if (nav) { if (nav.dataset.nav === 'newscan') { wizStep = 1; preflightState = 'idle'; } go(nav.dataset.nav); return; }
      var g = e.target.closest('[data-go]');
      if (g) {
        var t = g.dataset.target;
        if (t) { wiz.target = t; var tt = TARGETS.filter(function (x) { return x.id === t; })[0]; if (tt) wiz.path = tt.path; }
        wizStep = 1; preflightState = 'idle';
        go(g.dataset.go); return;
      }
      var os = e.target.closest('[data-open-scan]');
      if (os) { openScan = os.dataset.openScan; view = 'run'; render(); return; }
      var of = e.target.closest('[data-open-finding]');
      if (of) { openFinding = of.dataset.openFinding; view = 'findings'; render(); return; }
      var bf = e.target.closest('[data-back-findings]');
      if (bf) { openFinding = null; render(); return; }
      var ff = e.target.closest('[data-ff]');
      if (ff) { fFilter = ff.dataset.ff; render(); return; }
      var ex = e.target.closest('#export-csv');
      if (ex) { toast('Exported ' + FINDINGS.length + ' findings to CSV', 'ok'); return; }
    });

    document.addEventListener('input', function (e) {
      if (e.target.id === 'fq') {
        fQuery = e.target.value;
        var pos = e.target.selectionStart;
        render();
        var el = $('#fq');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
      }
    });

    function toggleTheme() {
      var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('kavach-theme', next); } catch (e) { }
    }
    $('#theme-btn').addEventListener('click', toggleTheme);
    $('#new-scan-btn').addEventListener('click', function () { wizStep = 1; preflightState = 'idle'; go('newscan'); });
    try { var th = localStorage.getItem('kavach-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { }

    render();
    renderStatusbar();
    startTicker();
  </script>
</body>

</html>
