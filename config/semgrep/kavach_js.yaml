            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            $M($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            async $M($REQ, $RES, ...) { ... }
  pattern-sanitizers:
    - pattern: parseInt(...)
    - pattern: parseFloat(...)
    - pattern: Number(...)
    - pattern: JSON.parse(...)
  pattern-sinks:
    - pattern: eval($X)
    - pattern: new Function(..., $X)
    - pattern: vm.runInNewContext($X, ...)
    - pattern: vm.runInThisContext($X, ...)
    - pattern: setTimeout($X, ...)
    - pattern: setInterval($X, ...)

