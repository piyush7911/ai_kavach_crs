rules:
# Generic Node/Express rules written for AI Kavach. Nothing here names a particular application:
# the engine must work on code it has not seen. Static hits are CANDIDATES; the dynamic probe
# (or a replayable exploit) is what confirms one.

- id: kavach-js-ssrf
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: A URL built from request input reaches an outbound HTTP client (SSRF).
  metadata: {cwe: "CWE-918", owasp: "A10:2021", kavach_class: ssrf, confidence: high}
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            function ($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            function $F($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            async function ($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            async function $F($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            ($REQ, $RES, ...) => { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            async ($REQ, $RES, ...) => { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            $M($REQ, $RES, ...) { ... }
    - patterns:
        - pattern-either:
            - pattern: $REQ.query
            - pattern: $REQ.body
            - pattern: $REQ.params
            - pattern: $REQ.headers
            - pattern: $REQ.cookies
        # The request is recognised by ROLE, not by name: the first parameter of a handler that
        # also takes a response/next argument. A target may call it req, request, ctx or x.
        - pattern-inside: |
            async $M($REQ, $RES, ...) { ... }
  pattern-sanitizers:
    - pattern: encodeURIComponent(...)
    - pattern: parseInt(...)
    - pattern: Number(...)
  pattern-sinks:
    - patterns: [{pattern: "needle.get($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "needle($M, $U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "axios.get($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "axios($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "request($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "request.get($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "http.get($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "https.get($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "got($U, ...)"}, {focus-metavariable: $U}]
    - patterns: [{pattern: "fetch($U, ...)"}, {focus-metavariable: $U}]

