- id: kavach-js-nosql-where
  languages: [javascript, typescript]
  severity: ERROR
  message: >
    A MongoDB $where clause is built by string interpolation. $where runs JavaScript on the
    database, so any interpolated value that is not provably numeric is injectable.
  metadata: {cwe: "CWE-943", owasp: "A03:2021", kavach_class: nosql-injection, confidence: medium}
  patterns:
    - pattern-either:
        - pattern: "{..., $where: `...${$V}...`, ...}"
        - pattern: '{..., $where: "..." + $V, ...}'
        - pattern: "{..., $where: $V, ...}"
    - pattern-not: '{..., $where: "...", ...}'

- id: kavach-js-hardcoded-secret
  languages: [javascript, typescript]
  severity: WARNING
  message: A secret-looking property is set to a literal string in source.
  metadata: {cwe: "CWE-798", owasp: "A02:2021", kavach_class: hardcoded-secret, confidence: medium}
  patterns:
    - pattern-either:
        - pattern: '{..., $K: "$V", ...}'
        - pattern: 'const $K = "$V"'
    - metavariable-regex:
        metavariable: $K
        regex: '(?i)^.*(secret|apikey|api_key|passwd|password|privatekey|private_key|cryptokey|signingkey).*$'
    - metavariable-regex:
        metavariable: $V
        regex: '^\S{8,}$'          # a secret has no spaces; "Invalid password" is a message
    - metavariable-regex:
        metavariable: $V
        regex: '^(?!.*(\$\{|process\.env|<|example|changeme)).*$'

- id: kavach-js-redos-nested-quantifier
  languages: [javascript, typescript]
  severity: WARNING
  message: A regular expression has a nested quantifier such as (a+)+, which backtracks catastrophically.
  metadata: {cwe: "CWE-1333", owasp: "A05:2021", kavach_class: redos, confidence: low}
  pattern-regex: '/[^/\n]*\([^()\n]*[+*]\)[+*][^/\n]*/'
